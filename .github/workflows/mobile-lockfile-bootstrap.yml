name: Mobile dependency lockfile bootstrap # one-time workspace lockfile generation

on:
  pull_request:
    paths:
      - "apps/mobile/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Resolve workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-lockfile-bootstrap.yml
          git add pnpm-lock.yaml
          git commit -m "chore: lock Android mobile workspace dependencies"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
