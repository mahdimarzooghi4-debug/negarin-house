name: Mobile dependency lockfile bootstrap

on:
  pull_request:
    paths:
      - "apps/mobile/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-lockfile-bootstrap.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Resolve workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: negarin-mobile-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
