services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: negarin
      POSTGRES_PASSWORD: negarin
      POSTGRES_DB: negarin
    ports:
      - "5432:5432"
    volumes:
      - negarin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U negarin -d negarin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - negarin-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  negarin-postgres:
  negarin-redis:
